name: (Local) Semantic Version Get

on:
  workflow_call:
    inputs:
      RELEASE_TYPE:
        description: 'Type of release (MAJOR, MINOR, PATCH, CURRENT, PRERELEASE, USE_PR_LABEL)'
        type: string
        required: true
      GIT_TAG:
        description: 'Create and push a git tag for the computed version'
        type: boolean
        default: false
    outputs:
      VERSION:
        description: 'The version to be used according to the release type input'
        value: ${{ jobs.Get-Version.outputs.VERSION }}
      VERSION_SKIP:
        description: 'Skip versioning'
        value: ${{ jobs.Get-Release-Type.outputs.VERSION_SKIP }}

jobs:

  Get-Release-Type:
    runs-on: ubuntu-latest
    outputs:
      VERSION_TYPE: ${{ steps.resolve.outputs.VERSION_TYPE }}
      VERSION_SKIP: ${{ steps.resolve.outputs.VERSION_SKIP }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:

      - name: Resolve release type
        id: resolve
        run: |
          if [ "${{ inputs.RELEASE_TYPE }}" != "USE_PR_LABEL" ]; then
            echo "VERSION_TYPE=${{ inputs.RELEASE_TYPE }}" >> "$GITHUB_OUTPUT"
            echo "VERSION_SKIP=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')

          if [ -z "$pr_number" ] || [ "$pr_number" == "null" ]; then
            echo "::error::No pull request found for commit ${{ github.sha }}; cannot resolve a release-type label."
            echo "VERSION_SKIP=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Resolved PR #$pr_number for commit ${{ github.sha }}"

          json_output=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/issues/${pr_number}/labels")

          major_count=$(echo "$json_output" | jq '[.[] | select(.name == "major-release")] | length')
          minor_count=$(echo "$json_output" | jq '[.[] | select(.name == "minor-release")] | length')
          patch_count=$(echo "$json_output" | jq '[.[] | select(.name == "patch-release")] | length')
          skip_count=$(echo "$json_output" | jq '[.[] | select(.name == "skip-release")] | length')
          labels_found=$(echo "$json_output" | jq -r '.[].name' | paste -sd, -)
          total_count=$((major_count + minor_count + patch_count + skip_count))

          if [ "$total_count" -ne 1 ]; then
            echo "::error::Expected exactly one release-type label on PR #$pr_number, found $total_count (labels: ${labels_found:-none})"
            echo "VERSION_SKIP=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$major_count" -eq 1 ]; then version_type="MAJOR"; fi
          if [ "$minor_count" -eq 1 ]; then version_type="MINOR"; fi
          if [ "$patch_count" -eq 1 ]; then version_type="PATCH"; fi
          if [ "$skip_count" -eq 1 ]; then version_type="CURRENT"; fi

          echo "Selected release version type: $version_type"
          echo "VERSION_TYPE=$version_type" >> "$GITHUB_OUTPUT"
          echo "VERSION_SKIP=$([ "$skip_count" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  Get-Version:
    runs-on: ubuntu-latest
    needs: Get-Release-Type
    outputs:
      VERSION: ${{ steps.set-next-version.outputs.VERSION }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        id: set-next-version
        shell: bash
        env:
          VERSION_TYPE: ${{ needs.Get-Release-Type.outputs.VERSION_TYPE }}
        run: |
          echo "Version Type: $VERSION_TYPE"

          git fetch --tags

          LATEST_TAG=$(git tag -l "v*" --sort=committerdate | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | tail -1 || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "Warning: No tags found!"
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION=${LATEST_TAG#v}
          fi

          echo "Current version: $CURRENT_VERSION"

          old_IFS=$IFS
          IFS='.'
          read -r major minor patch <<< "$CURRENT_VERSION"
          IFS=$old_IFS

          case "$VERSION_TYPE" in
            MAJOR) major=$((major + 1)); minor=0; patch=0 ;;
            MINOR) minor=$((minor + 1)); patch=0 ;;
            PATCH) patch=$((patch + 1)) ;;
            PRERELEASE) patch=$((patch + 1)) ;;
            CURRENT) echo "No version increment" ;;
            *) echo "::error::Invalid release version type: $VERSION_TYPE"; exit 1 ;;
          esac

          next_version="${major}.${minor}.${patch}"
          echo "Version to consider: ${next_version}"

          if [ "$VERSION_TYPE" == "PRERELEASE" ]; then
            date=$(date '+%Y%m%d')
            echo "Pre-release version checks for $date"

            latest_daily_prerelease_counter=$(git tag -l "v*" | grep -E "^v${major}\.${minor}\.${patch}-pre${date}\.[0-9]+$" | awk -F "pre${date}." '{print $NF}' | tail -1 || echo "")

            if [ -z "$latest_daily_prerelease_counter" ]; then
              next_prerelease_counter="1"
            else
              next_prerelease_counter=$((latest_daily_prerelease_counter + 1))
            fi

            next_version="${major}.${minor}.${patch}-pre${date}.${next_prerelease_counter}"
            echo "Pre-release version: ${next_version}"
          fi

          echo "VERSION=${next_version}" >> "$GITHUB_OUTPUT"

  Tag-Version:
    if: ${{ inputs.GIT_TAG && needs.Get-Release-Type.outputs.VERSION_SKIP != 'true' }}
    runs-on: ubuntu-latest
    needs:
      - Get-Release-Type
      - Get-Version
    permissions:
      contents: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Set GitHub tag
        run: |
          VERSION="${{ needs.Get-Version.outputs.VERSION }}"

          if [ -z "$VERSION" ]; then
            echo "::error::VERSION is not set!"
            exit 1
          fi

          next_tag="v$VERSION"
          echo "Next GitHub tag: ${next_tag}"
          git tag "${next_tag}"
          git push --tags
