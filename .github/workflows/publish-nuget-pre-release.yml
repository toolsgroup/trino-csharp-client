name: Publish .NET Packages (Pre-Release)

on:
  workflow_dispatch:

jobs:

  version-pre-release:
    uses: toolsgroup/tg-shared-actions/.github/workflows/shared-semver-get.yml@main
    with:
      RELEASE_TYPE: "PRERELEASE"
      GIT_TAG: true
    secrets: inherit

  publish-nuget-packages:
    needs: version-pre-release
    uses: toolsgroup/tg-shared-actions/.github/workflows/shared-nuget-publish-dotnet.yml@main
    with:
      SEMANTIC_VERSION: ${{ needs.version-pre-release.outputs.VERSION }}
      NUGET_JSON: 'apps/nuget.json'
    secrets: inherit
