name: Publish NuGet Packages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:

  version:
    uses: ./.github/workflows/_semver-get.yml
    with:
      RELEASE_TYPE: USE_PR_LABEL
      GIT_TAG: true
    secrets: inherit

  publish-nuget-packages:
    needs: version
    if: needs.version.outputs.VERSION_SKIP != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build trino-csharp/TrinoDriver.sln --configuration Release

      - name: Pack NuGet packages
        # dotnet pack races Build against Pack across projects in the same solution when it builds
        # implicitly -- build explicitly first, then pack --no-build against the finished output.
        run: dotnet pack trino-csharp/TrinoDriver.sln --configuration Release --no-build

      - name: Publish NuGet packages
        run: |
          # dotnet pack packs every packable project in the solution (including upstream's own
          # Trino.Client.Auth and Trino.Client.Samples) -- only push our two ToolsGroup.Trino.*
          # packages, not everything that happened to end up in the output folder.
          echo "Pushing packages:"
          ls trino-csharp/NugetPack/ToolsGroup.Trino.*.nupkg
          dotnet nuget push trino-csharp/NugetPack/ToolsGroup.Trino.*.nupkg \
            --source "https://nuget.pkg.github.com/toolsgroup/index.json" \
            --api-key "${{ secrets.GIT_PASSWORD }}" \
            --skip-duplicate
