name: .Net Code Test for PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  Run-Test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build trino-csharp/TrinoDriver.sln --configuration Release

      - name: Test
        run: dotnet test trino-csharp/TrinoDriver.sln --configuration Release --verbosity normal
